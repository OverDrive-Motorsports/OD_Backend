name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  GO_VERSION: "1.25"

jobs:
  # ---------------------------------------------------------------------------
  # lint: gofmt must report nothing and go vet must pass, per module.
  # ---------------------------------------------------------------------------
  lint-module:
    name: lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - gateway
          - services/auth-service
          - services/championship-service
          - services/ingestion-service
          - services/race-data-service
          - services/user-data-service
          - shared/apierror
          - shared/bootstrap
          - shared/contracts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: Generate Prisma client
        if: contains(fromJSON('["services/auth-service", "services/championship-service", "services/race-data-service"]'), matrix.module)
        working-directory: ${{ matrix.module }}
        run: go run github.com/steebchen/prisma-client-go generate --schema resources/schema.prisma

      - name: gofmt
        working-directory: ${{ matrix.module }}
        run: |
          unformatted=$(find . -name '*.go' -not -path './resources/db/*' -print0 | xargs -0 -r gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt reported unformatted files; run 'gofmt -w' on them"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    needs: lint-module
    if: always()
    steps:
      - name: Check lint matrix result
        run: |
          if [ "${{ needs.lint-module.result }}" != "success" ]; then
            echo "::error::one or more modules failed lint"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # test: unit tests per module, race detector enabled.
  # ---------------------------------------------------------------------------
  test-module:
    name: test (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - gateway
          - services/auth-service
          - services/championship-service
          - services/ingestion-service
          - services/race-data-service
          - services/user-data-service
          - shared/apierror
          - shared/bootstrap
          - shared/contracts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: Generate Prisma client
        if: contains(fromJSON('["services/auth-service", "services/championship-service", "services/race-data-service"]'), matrix.module)
        working-directory: ${{ matrix.module }}
        run: go run github.com/steebchen/prisma-client-go generate --schema resources/schema.prisma

      - name: go test
        working-directory: ${{ matrix.module }}
        run: go test ./... -race

  test:
    name: test
    runs-on: ubuntu-latest
    needs: test-module
    if: always()
    steps:
      - name: Check test matrix result
        run: |
          if [ "${{ needs.test-module.result }}" != "success" ]; then
            echo "::error::one or more modules failed tests"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # build: compile every package of every module.
  # ---------------------------------------------------------------------------
  build-module:
    name: build (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - gateway
          - services/auth-service
          - services/championship-service
          - services/ingestion-service
          - services/race-data-service
          - services/user-data-service
          - shared/apierror
          - shared/bootstrap
          - shared/contracts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: Generate Prisma client
        if: contains(fromJSON('["services/auth-service", "services/championship-service", "services/race-data-service"]'), matrix.module)
        working-directory: ${{ matrix.module }}
        run: go run github.com/steebchen/prisma-client-go generate --schema resources/schema.prisma

      - name: go build
        working-directory: ${{ matrix.module }}
        run: go build ./...

  build:
    name: build
    runs-on: ubuntu-latest
    needs: build-module
    if: always()
    steps:
      - name: Check build matrix result
        run: |
          if [ "${{ needs.build-module.result }}" != "success" ]; then
            echo "::error::one or more modules failed to build"
            exit 1
          fi
