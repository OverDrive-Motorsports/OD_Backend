name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  GO_VERSION: "1.27"
  # Analyzer versions, bumped by hand.
  GOVULNCHECK_VERSION: v1.10.0
  STATICCHECK_VERSION: v0.8.2
  GOSEC_VERSION: v2.30.0

jobs:
  # ---------------------------------------------------------------------------
  # lint: gofmt, go vet, staticcheck, gosec and govulncheck must pass, per
  # module. Accepted findings carry an inline `//lint:ignore` or `#nosec` with
  # the reason.
  # ---------------------------------------------------------------------------
  lint-module:
    name: lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - gateway
          - services/auth-service
          - services/championship-service
          - services/ingestion-service
          - services/race-data-service
          - services/user-data-service
          - shared/apierror
          - shared/authjwt
          - shared/bootstrap
          - shared/contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # Latest 1.27 patch, not whatever the runner image caches: govulncheck
          # reports the stdlib advisories of the Go that runs it.
          check-latest: true
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: Generate Prisma client
        if: contains(fromJSON('["services/auth-service", "services/championship-service", "services/race-data-service", "services/user-data-service"]'), matrix.module)
        working-directory: ${{ matrix.module }}
        run: go run github.com/steebchen/prisma-client-go generate --schema resources/schema.prisma

      - name: gofmt
        working-directory: ${{ matrix.module }}
        run: |
          unformatted=$(find . -name '*.go' -not -path './resources/db/*' -print0 | xargs -0 -r gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt reported unformatted files; run 'gofmt -w' on them"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      - name: Install analyzers
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
          go install honnef.co/go/tools/cmd/staticcheck@${{ env.STATICCHECK_VERSION }}
          go install github.com/securego/gosec/v2/cmd/gosec@${{ env.GOSEC_VERSION }}

      - name: staticcheck
        working-directory: ${{ matrix.module }}
        run: staticcheck ./...

      - name: gosec
        working-directory: ${{ matrix.module }}
        run: gosec -quiet -exclude-generated -exclude-dir=resources ./...

      - name: govulncheck
        working-directory: ${{ matrix.module }}
        run: govulncheck ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    needs: lint-module
    if: always()
    steps:
      - name: Check lint matrix result
        run: |
          if [ "${{ needs.lint-module.result }}" != "success" ]; then
            echo "::error::one or more modules failed lint"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # test: unit tests per module, race detector enabled, with a minimum coverage
  # per module (tools/coverage-thresholds.txt); plus the database integration
  # tests of the Prisma repositories against a real Postgres.
  # ---------------------------------------------------------------------------
  test-module:
    name: test (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - gateway
          - services/auth-service
          - services/championship-service
          - services/ingestion-service
          - services/race-data-service
          - services/user-data-service
          - shared/apierror
          - shared/authjwt
          - shared/bootstrap
          - shared/contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # Latest 1.27 patch, not whatever the runner image caches: govulncheck
          # reports the stdlib advisories of the Go that runs it.
          check-latest: true
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: Generate Prisma client
        if: contains(fromJSON('["services/auth-service", "services/championship-service", "services/race-data-service", "services/user-data-service"]'), matrix.module)
        working-directory: ${{ matrix.module }}
        run: go run github.com/steebchen/prisma-client-go generate --schema resources/schema.prisma

      - name: go test with coverage gate
        run: tools/coverage.sh ${{ matrix.module }}

  integration-module:
    name: integration (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth
          - championship
          - race-data
          - user-data
    services:
      postgres:
        # Same image as docker-compose.yml. Throwaway container: the password
        # only protects a database that lives for this job.
        image: postgres:16.16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: Generate Prisma client
        working-directory: services/${{ matrix.service }}-service
        run: go run github.com/steebchen/prisma-client-go generate --schema resources/schema.prisma

      - name: Integration tests
        env:
          INTEGRATION_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432
        run: tools/integration-test.sh ${{ matrix.service }}

  test:
    name: test
    runs-on: ubuntu-latest
    needs: [test-module, integration-module]
    if: always()
    steps:
      - name: Check test matrix results
        run: |
          if [ "${{ needs.test-module.result }}" != "success" ]; then
            echo "::error::one or more modules failed unit tests or their coverage minimum"
            exit 1
          fi
          if [ "${{ needs.integration-module.result }}" != "success" ]; then
            echo "::error::one or more services failed the database integration tests"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # build: compile every package of every module, in the workspace and on its
  # own (each go.mod must declare its real dependencies and shared/* replaces),
  # and build the production images.
  # ---------------------------------------------------------------------------
  build-module:
    name: build (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - gateway
          - services/auth-service
          - services/championship-service
          - services/ingestion-service
          - services/race-data-service
          - services/user-data-service
          - shared/apierror
          - shared/authjwt
          - shared/bootstrap
          - shared/contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # Latest 1.27 patch, not whatever the runner image caches: govulncheck
          # reports the stdlib advisories of the Go that runs it.
          check-latest: true
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: Generate Prisma client
        if: contains(fromJSON('["services/auth-service", "services/championship-service", "services/race-data-service", "services/user-data-service"]'), matrix.module)
        working-directory: ${{ matrix.module }}
        run: go run github.com/steebchen/prisma-client-go generate --schema resources/schema.prisma

      - name: go build
        working-directory: ${{ matrix.module }}
        run: go build ./...

      - name: go build outside the workspace
        working-directory: ${{ matrix.module }}
        env:
          GOWORK: "off"
        run: go build ./...

  # Production image of every binary (Dockerfile next to its go.mod), built
  # from the repository root, then checked: distroless nonroot user, no Go
  # source and no .env in its filesystem, binary answers its command line.
  image-module:
    name: image (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - gateway
          - services/auth-service
          - services/championship-service
          - services/ingestion-service
          - services/race-data-service
          - services/user-data-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: docker build
        run: docker build -f ${{ matrix.module }}/Dockerfile -t overdrive-ci-image .

      - name: Check the image
        run: |
          user="$(docker image inspect -f '{{.Config.User}}' overdrive-ci-image)"
          if [ "$user" != "nonroot:nonroot" ]; then
            echo "::error::image user is '$user', want nonroot:nonroot"
            exit 1
          fi
          container="$(docker create overdrive-ci-image)"
          leaked="$(docker export "$container" | tar -t | grep -E '(\.go|(^|/)\.env|go\.mod)$' || true)"
          docker rm "$container" >/dev/null
          if [ -n "$leaked" ]; then
            echo "::error::the image contains source or .env files:"
            echo "$leaked"
            exit 1
          fi
          # An unknown command must fail with the usage error: the binary runs in the image.
          if docker run --rm overdrive-ci-image no-such-command 2>err.txt; then
            echo "::error::the binary accepted an unknown command"
            exit 1
          fi
          grep -q 'unknown command' err.txt || { cat err.txt; exit 1; }

  build:
    name: build
    runs-on: ubuntu-latest
    needs: [build-module, image-module]
    if: always()
    steps:
      - name: Check build matrix result
        run: |
          if [ "${{ needs.build-module.result }}" != "success" ]; then
            echo "::error::one or more modules failed to build"
            exit 1
          fi
          if [ "${{ needs.image-module.result }}" != "success" ]; then
            echo "::error::one or more production images failed to build or their checks"
            exit 1
          fi
