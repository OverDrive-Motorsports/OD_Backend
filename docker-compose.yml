services:
  postgres:
    image: postgres:16-alpine
    container_name: overdrive-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - overdrive-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/10-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth-dbsync:
    image: golang:1.25
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app/services/auth-service
    environment:
      AUTH_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/overdrive_auth?schema=public
      GOCACHE: /tmp/go-build
    command:
      - sh
      - -c
      - go run github.com/steebchen/prisma-client-go db push --schema resources/schema.prisma --skip-generate
    volumes:
      - .:/app
    restart: "no"

  user-data-dbsync:
    image: golang:1.25
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app/services/user-data-service
    environment:
      USER_DATA_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/overdrive_user_data?schema=public
      GOCACHE: /tmp/go-build
    command:
      - sh
      - -c
      - go run github.com/steebchen/prisma-client-go db push --schema resources/schema.prisma --skip-generate
    volumes:
      - .:/app
    restart: "no"

  championship-dbsync:
    image: golang:1.25
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app/services/championship-service
    environment:
      CHAMPIONSHIP_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/overdrive_championship?schema=public
      GOCACHE: /tmp/go-build
    command:
      - sh
      - -c
      - go run github.com/steebchen/prisma-client-go db push --schema resources/schema.prisma --skip-generate
    volumes:
      - .:/app
    restart: "no"

  race-data-dbsync:
    image: golang:1.25
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app/services/race-data-service
    environment:
      RACE_DATA_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/overdrive_race_data?schema=public
      GOCACHE: /tmp/go-build
    command:
      - sh
      - -c
      - go run github.com/steebchen/prisma-client-go db push --schema resources/schema.prisma --skip-generate
    volumes:
      - .:/app
    restart: "no"

  auth-service:
    image: golang:1.25
    depends_on:
      postgres:
        condition: service_healthy
      auth-dbsync:
        condition: service_completed_successfully
    working_dir: /app
    environment:
      HTTP_PORT: "3001"
      APP_VERSION: dev
      AUTH_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/overdrive_auth?schema=public
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      GOCACHE: /tmp/go-build
    command:
      - sh
      - -c
      - go run ./services/auth-service
    volumes:
      - .:/app
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:$${HTTP_PORT}/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 60s

  user-data-service:
    image: golang:1.25
    depends_on:
      postgres:
        condition: service_healthy
      user-data-dbsync:
        condition: service_completed_successfully
    working_dir: /app
    environment:
      HTTP_PORT: "3002"
      APP_VERSION: dev
      USER_DATA_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/overdrive_user_data?schema=public
      GOCACHE: /tmp/go-build
    command:
      - sh
      - -c
      - go run ./services/user-data-service
    volumes:
      - .:/app
    ports:
      - "3002:3002"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:$${HTTP_PORT}/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 60s

  championship-service:
    image: golang:1.25
    depends_on:
      postgres:
        condition: service_healthy
      championship-dbsync:
        condition: service_completed_successfully
    working_dir: /app
    environment:
      HTTP_PORT: "3003"
      APP_VERSION: dev
      CHAMPIONSHIP_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/overdrive_championship?schema=public
      GOCACHE: /tmp/go-build
    command:
      - sh
      - -c
      - go run ./services/championship-service
    volumes:
      - .:/app
    ports:
      - "3003:3003"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:$${HTTP_PORT}/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 60s

  race-data-service:
    image: golang:1.25
    depends_on:
      postgres:
        condition: service_healthy
      race-data-dbsync:
        condition: service_completed_successfully
      championship-service:
        condition: service_healthy
    working_dir: /app
    environment:
      HTTP_PORT: "3004"
      APP_VERSION: dev
      RACE_DATA_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/overdrive_race_data?schema=public
      CHAMPIONSHIP_SERVICE_URL: http://championship-service:3003
      GOCACHE: /tmp/go-build
    command:
      - sh
      - -c
      - go run ./services/race-data-service
    volumes:
      - .:/app
    ports:
      - "3004:3004"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:$${HTTP_PORT}/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 60s

  ingestion-service:
    image: golang:1.25
    depends_on:
      championship-service:
        condition: service_healthy
      race-data-service:
        condition: service_healthy
    working_dir: /app
    environment:
      HTTP_PORT: "3005"
      APP_VERSION: dev
      OPENF1_BASE_URL: https://api.openf1.org/v1
      OPENF1_TIMEOUT: 10s
      OPENF1_RETRY_COUNT: "2"
      OPENF1_RETRY_DELAY: 500ms
      DISPATCH_TIMEOUT: 10m
      CHAMPIONSHIP_SERVICE_URL: http://championship-service:3003
      RACE_DATA_SERVICE_URL: http://race-data-service:3004
      GOCACHE: /tmp/go-build
    command:
      - sh
      - -c
      - go run ./services/ingestion-service
    volumes:
      - .:/app
    ports:
      - "3005:3005"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:$${HTTP_PORT}/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 60s

  gateway:
    image: golang:1.25
    depends_on:
      auth-service:
        condition: service_healthy
      user-data-service:
        condition: service_healthy
      championship-service:
        condition: service_healthy
      race-data-service:
        condition: service_healthy
      ingestion-service:
        condition: service_healthy
    working_dir: /app
    environment:
      HTTP_PORT: "3000"
      APP_VERSION: dev
      GATEWAY_AUTH_TOKEN: ${GATEWAY_AUTH_TOKEN}
      GATEWAY_RATE_LIMIT_RPS: ${GATEWAY_RATE_LIMIT_RPS}
      GATEWAY_RATE_LIMIT_BURST: ${GATEWAY_RATE_LIMIT_BURST}
      AUTH_SERVICE_URLS: http://auth-service:3001
      USER_DATA_SERVICE_URLS: http://user-data-service:3002
      CHAMPIONSHIP_SERVICE_URLS: http://championship-service:3003
      RACE_DATA_SERVICE_URLS: http://race-data-service:3004
      INGESTION_SERVICE_URLS: http://ingestion-service:3005
      GOCACHE: /tmp/go-build
    command:
      - sh
      - -c
      - go run ./gateway
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:$${HTTP_PORT}/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 60s

volumes:
  overdrive-postgres-data:
