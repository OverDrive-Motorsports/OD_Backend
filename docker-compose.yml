# OverDrive stack. The services run from their production images (one
# Dockerfile per binary, built here from the repository root); configuration
# comes from the root .env only (Compose interpolation), no .env file enters an
# image.
#
#   docker compose up -d --build
#
# The *-dbsync jobs push each Prisma schema before its service starts; they run
# the mounted sources in golang:1.27 (schema tooling, not part of the images).
#
# For development from the mounted sources (no image rebuild), add the
# override: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d

x-go-service: &go-service
  # Above SHUTDOWN_TIMEOUT (35 s default) so the graceful shutdown completes before SIGKILL.
  stop_grace_period: 45s

x-healthcheck: &healthcheck
  interval: 5s
  timeout: 3s
  retries: 20
  start_period: 60s

services:
  postgres:
    image: postgres:16.16-alpine
    container_name: overdrive-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - overdrive-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/10-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth-dbsync:
    image: golang:1.27
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app/services/auth-service
    environment:
      AUTH_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/overdrive_auth?schema=public
      GOCACHE: /tmp/go-build
    command:
      - sh
      - -c
      - go run github.com/steebchen/prisma-client-go db push --schema resources/schema.prisma --skip-generate
    volumes:
      - .:/app
    restart: "no"

  user-data-dbsync:
    image: golang:1.27
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app/services/user-data-service
    environment:
      USER_DATA_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/overdrive_user_data?schema=public
      GOCACHE: /tmp/go-build
    command:
      - sh
      - -c
      - go run github.com/steebchen/prisma-client-go db push --schema resources/schema.prisma --skip-generate
    volumes:
      - .:/app
    restart: "no"

  championship-dbsync:
    image: golang:1.27
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app/services/championship-service
    environment:
      CHAMPIONSHIP_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/overdrive_championship?schema=public
      GOCACHE: /tmp/go-build
    command:
      - sh
      - -c
      - go run github.com/steebchen/prisma-client-go db push --schema resources/schema.prisma --skip-generate
    volumes:
      - .:/app
    restart: "no"

  race-data-dbsync:
    image: golang:1.27
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app/services/race-data-service
    environment:
      RACE_DATA_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/overdrive_race_data?schema=public
      GOCACHE: /tmp/go-build
    command:
      - sh
      - -c
      - go run github.com/steebchen/prisma-client-go db push --schema resources/schema.prisma --skip-generate
    volumes:
      - .:/app
    restart: "no"

  # ---------------------------------------------------------------------------
  # Services, from their production images (one Dockerfile per binary, built
  # from the repository root). Only the gateway is published on every
  # interface; the others bind 127.0.0.1 for local debugging.
  # ---------------------------------------------------------------------------
  auth-service:
    <<: *go-service
    image: overdrive/auth-service:${OVERDRIVE_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      auth-dbsync:
        condition: service_completed_successfully
    environment:
      HTTP_PORT: "3001"
      APP_VERSION: ${APP_VERSION:-dev}
      AUTH_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/overdrive_auth?schema=public
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      # Empty = the Google sign-in is disabled.
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URL: ${GOOGLE_OAUTH_REDIRECT_URL:-}
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/usr/local/bin/auth-service", "healthcheck"]

  user-data-service:
    <<: *go-service
    image: overdrive/user-data-service:${OVERDRIVE_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: services/user-data-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      user-data-dbsync:
        condition: service_completed_successfully
    environment:
      HTTP_PORT: "3002"
      APP_VERSION: ${APP_VERSION:-dev}
      USER_DATA_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/overdrive_user_data?schema=public
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
    ports:
      - "127.0.0.1:3002:3002"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/usr/local/bin/user-data-service", "healthcheck"]

  championship-service:
    <<: *go-service
    image: overdrive/championship-service:${OVERDRIVE_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: services/championship-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      championship-dbsync:
        condition: service_completed_successfully
    environment:
      HTTP_PORT: "3003"
      APP_VERSION: ${APP_VERSION:-dev}
      CHAMPIONSHIP_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/overdrive_championship?schema=public
      INTERNAL_INGESTION_TOKEN: ${INTERNAL_INGESTION_TOKEN}
    ports:
      - "127.0.0.1:3003:3003"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/usr/local/bin/championship-service", "healthcheck"]

  race-data-service:
    <<: *go-service
    image: overdrive/race-data-service:${OVERDRIVE_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: services/race-data-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      race-data-dbsync:
        condition: service_completed_successfully
      championship-service:
        condition: service_healthy
    environment:
      HTTP_PORT: "3004"
      APP_VERSION: ${APP_VERSION:-dev}
      RACE_DATA_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/overdrive_race_data?schema=public
      CHAMPIONSHIP_SERVICE_URL: http://championship-service:3003
      INTERNAL_INGESTION_TOKEN: ${INTERNAL_INGESTION_TOKEN}
    ports:
      - "127.0.0.1:3004:3004"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/usr/local/bin/race-data-service", "healthcheck"]

  ingestion-service:
    <<: *go-service
    image: overdrive/ingestion-service:${OVERDRIVE_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: services/ingestion-service/Dockerfile
    depends_on:
      championship-service:
        condition: service_healthy
      race-data-service:
        condition: service_healthy
    environment:
      HTTP_PORT: "3005"
      APP_VERSION: ${APP_VERSION:-dev}
      OPENF1_BASE_URL: https://api.openf1.org/v1
      OPENF1_TIMEOUT: 30s
      OPENF1_RETRY_COUNT: "2"
      OPENF1_RETRY_DELAY: 500ms
      OPENF1_MIN_REQUEST_INTERVAL: 350ms
      OPENF1_USERNAME: ${OPENF1_USERNAME:-}
      OPENF1_PASSWORD: ${OPENF1_PASSWORD:-}
      OPENF1_TOKEN_URL: ${OPENF1_TOKEN_URL:-}
      OPENF1_LIVE_POLL_INTERVAL: ${OPENF1_LIVE_POLL_INTERVAL:-}
      OPENF1_LIVE_GRACE: ${OPENF1_LIVE_GRACE:-}
      OPENF1_LIVE_MAX_FAILURES: ${OPENF1_LIVE_MAX_FAILURES:-}
      OPENF1_LIVE_MAX_JOBS: ${OPENF1_LIVE_MAX_JOBS:-}
      DISPATCH_TIMEOUT: 10m
      CHAMPIONSHIP_SERVICE_URL: http://championship-service:3003
      RACE_DATA_SERVICE_URL: http://race-data-service:3004
      INTERNAL_INGESTION_TOKEN: ${INTERNAL_INGESTION_TOKEN}
    ports:
      - "127.0.0.1:3005:3005"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/usr/local/bin/ingestion-service", "healthcheck"]

  gateway:
    <<: *go-service
    image: overdrive/gateway:${OVERDRIVE_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: gateway/Dockerfile
    depends_on:
      auth-service:
        condition: service_healthy
      user-data-service:
        condition: service_healthy
      championship-service:
        condition: service_healthy
      race-data-service:
        condition: service_healthy
      ingestion-service:
        condition: service_healthy
    environment:
      HTTP_PORT: "3000"
      APP_VERSION: ${APP_VERSION:-dev}
      GATEWAY_AUTH_TOKEN: ${GATEWAY_AUTH_TOKEN}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      GATEWAY_RATE_LIMIT_RPS: ${GATEWAY_RATE_LIMIT_RPS}
      GATEWAY_RATE_LIMIT_BURST: ${GATEWAY_RATE_LIMIT_BURST}
      GATEWAY_TRUSTED_PROXIES: ${GATEWAY_TRUSTED_PROXIES:-}
      AUTH_SERVICE_URLS: http://auth-service:3001
      USER_DATA_SERVICE_URLS: http://user-data-service:3002
      CHAMPIONSHIP_SERVICE_URLS: http://championship-service:3003
      RACE_DATA_SERVICE_URLS: http://race-data-service:3004
      INGESTION_SERVICE_URLS: http://ingestion-service:3005
    ports:
      - "3000:3000"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/usr/local/bin/gateway", "healthcheck"]

volumes:
  overdrive-postgres-data:
